current_phase: P0 - 证据与安全模拟 MCL 基线
current_evidence_level: E0

validated_capabilities:
  - "仅模拟的 MCL 契约流程：observation -> state -> 结构化 action -> safety -> 模拟回执 -> post-observation -> 验证 -> 回合 JSON。"
  - "针对低质量 observation、无效工作空间、过期标定、重试预算耗尽以及模拟通信超时等情况的模拟安全失败路由。"
  - "遗留的直接控制组合根在初始化相机或 STM32 模块之前已被禁用。"

unvalidated_claims:
  - "任何物理相机捕获或图像质量测量。"
  - "在项目相关的真实污染上的 OpenCV 或 YOLO 检测。"
  - "相机到工作空间的标定、坐标精度或标定有效期。"
  - "STM32 通信、XY 运动、泵/喷嘴执行、联锁、急停或 ExecutionReceipt 保真度。"
  - "已验证的清洁、损伤检测、可重复性或端到端硬件闭环。"

