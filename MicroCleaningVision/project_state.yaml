major_risks:
  - "源码当前PB12，旧资料仍有PB2；必须核对同次烧录和接线。默认ARM按钮非强制，轮询联锁不替代独立断电。"
  - "名义针头偏移7680步仍未实测确认。主机不再用步数边界拦住移动。固件一条报文最多20000步，不能作为几何验收。TO_SCOPE是相对反向而非回零，主机/固件不得重复补偿。"
  - "固件限时不能修复center_object尝试耗尽后喷水、补关缺口、相机/标定硬编码；本轮未改这些主机文件。"
  - "Demo运动关卡只覆盖当前主发送器；center_object和calibrate_motor_mm_per_px脚本直接发串口运动，不能宣称所有运动入口都统一授权。"
  - "三人尚无稳定投入时间，采用核心/扩展/备用任务和实际专注时段回填。"
  - "用户持有相机和GPU经验，A阶段负担可能在标注/训练期上升，需要按两轮真实记录再平衡。"
  - "旧原型目录 legacy 已删除；不要把 YOLO、双目或 3D 空实现重新放回主入口。"
  - "模型训练可能被过早启动；必须先有HSV失败、人工标注和独立测试集。"
  - "HSV默认参数只针对高饱和红色标记物；真实相机、材料和光照变化可能使其立即失效。"
  - "Demo路线只考虑mask几何，不包含喷头直径、速度、平台动力学和真实障碍物。"

blockers:
  - "已有USB probe图片和本机camera Demo，但U500身份、条件、驱动信息和重复采集证据包未完成正式验收。"
  - "同条件可追溯U500批次数据集仍缺；旧13图已labeled且冻结开发/留出，来源unknown，不能写成U500过关集。"
  - "真实标记物、样本状态和固定成像条件尚未形成证据。"
  - "当前单一联合固件源码已支持XY和MCV1限时泵；新主机已接持续会话/单一偏移接口，真实方向/偏移/回程误差未验收，实际PB2接线、烧录版本和通电测试未验收。离线测试不等于联调完成。"
  - "步进方向和双轴试验已有提交，步距、限位开关、像素到毫米仍未验收。电机转了不是清洗。"

next_actions:
  - "WORKBENCH-FIELD-01：软件界面完成Mock后，由操作者按手册审核子集；H1/H2先交同次接线/烧录/STOP及标定，A/B交可比前后图；再单目标独立现场验收。不要把Mock报告PASS解释为实物效果。"
  - "C-LOOP-FIELD-01：H2交三份实测配置、H1交同次固件/接线/停止证据、A/B交可比图后，C仅做新单入口--real --max-cycles 1、默认不重试，逐轮YES并保存完整运行目录；未实物运行。"
  - "TEAM-POST-01：从同学机拷回成功 Episode、PONG 原文和命令；不要在无 diff 时覆盖本机 demo/ 当官方实喷。"
  - "A-P1-U500-01：插入U500后运行scripts/probe_usb_camera.py，再运行--capture-test；保存index、分辨率、FPS、PNG、SHA256和质量结果。"
  - "B-U500-01：只在 U500 开发集一次改 LocalContrastPolicy 一个字段；升降看新留出，不碰 public_002/011/M9/M12。"
  - "C-PATH-01：analyze 不发步进。stage2-move 必须有标定 JSON、运动关卡、人确认和 --arm-stage2-xy。无实测标定不把毫米写成已验收。"
  - "H1-PUMP-01：核对已有定时/停止通路及PB0/PB2/PB3接线；批准后现场测输出与短喷覆盖；不要重做计时状态机。"
  - "H2-MOTION-01：测方向/步距/行程和显微镜到针头的有符号偏移；先短距离验收，不能直接试名义7680步。"
  - "HW-COMMON-01：H1主改、H2复核当前联合固件的构建/烧录身份和停止证据；旧Stage1只作兼容对照。"
  - "C-ENTRY-01（旧独立脚本未实施）：center_object/标定入口授权、耗尽判失败、异常补关另给文件级方案；新闭环入口已接单一偏移与回原视野复检，不能因此宣称旧工具已安全整改。"
  - "A-P1-DATA-01：13张已登记；继续核实来源、设备、倍率和日期，无法核实的字段保持unknown。"
  - "A-P1-LABEL-01：13张已labeled；开发9张、留出public_002/public_011/M9/M12已冻结。不要为刷分改留出标注。"
  - "A-P1-CAPTURE-01：补采至少12张、两个批次的USB显微镜图片；先导入1张运行analyze，再扩展到50张。"
  - "说明：Agent每次改代码或制定改进计划先完整读六份项目记忆，再核对Git与提交/进度日志。本机main停在2026-09-13，不要用它判断进度。"

