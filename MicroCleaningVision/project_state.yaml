validated_capabilities:
  - "项目.venv中150项测试全部执行并通过，无跳过：含 metadata、数据审计、标注转换、Mask评价（IoU/P/R/FP/FN、labeled 与 develop/holdout 分表）、USBCamera/live 无硬件测试、HSV/Otsu/ExG/ExR/邻域差异 local、离线 mm/px、分段路径、Demo v0.2、PUMP_IN_PLACE、STM32 协议与 STM32SerialController（含 stop/ESTOP/超时）。"
  - "真实文件入口测试会由OpenCV解码程序生成PNG、计算SHA-256和基础质量指标；图片仍不是团队相机采集证据。"
  - "Mock和软件回放不会打开真实COM口；main.py只运行纯合成Mock。"
  - "无标定状态不会产生毫米目标；模拟审批令牌绑定、超时和失败路由有回归测试。"
  - "Demo v0.2：文件/合成图/USB抓帧可进入同一入口；analyze/camera-analyze/live 默认不发泵；ping-only 只探测 PING/STATUS；arm-pump 须 Human Gate，STM32 还须 --arm-pump。"
  - "MicroCleaning Dataset清单入口具备init/import/check、SHA-256去重和文件篡改检查；data/metadata.csv当前有13条来源待核实的记录。"
  - "A数据工具已实际检查data/raw_images中的13张JPG：13张可解码、0损坏、0个相同SHA-256重复组；13张已登记。"
  - "Labelme contamination Polygon/Circle可被严格校验并转换为同尺寸二值Mask；人工Mask与算法Mask可计算IoU、Precision/Recall、FP/FN、面积误差和中心像素误差。comparison_summary 把 labeled、develop、holdout 分开，并按算法汇总。"
  - "Labelme批量转换可从JSON的imagePath自动定位data/raw_images内原图，支持Polygon/Circle；当前13份JSON已全部转换，报告为13成功、0失败。"
  - "public_001.jpg已完成质量检查、人工Polygon、人工Mask、HSV预测Mask和定量评价：IoU=0.0739，算法面积比人工多911px，中心误差86.87px。该证据证明链路可运行，同时证明当前HSV基线在此图上失败。"
  - "邻域差异 local-contrast-v0.1 已实现：Lab 局部背景差 + Otsu + 丢掉细长块。Demo 与 run_baseline 默认均为 local；HSV 仅对照。看见污渍不会发泵。留出评价另见 comparison_summary，这不是识别过关。"
  - "metadata_builder默认dry-run，可自动填写文件名和分辨率并保留人工行；已执行apply生成13条记录，13张均标记为labeled。"
  - "USBCamera实现CameraPort，使用OpenCV VideoCapture、预热帧、无损PNG、现有质量检查和build_observation；7项FakeVideoCapture测试覆盖正常抓帧、驱动异常及四类失败并确认release。"
  - "MCV1电脑端协议可编码PING/STATUS/STOP/受限PUMP并解析PONG/STATUS/ACK/DONE/ERR；STM32SerialController 实现 ControllerPort，默认拒泵，可 stop 且不发泵；探测脚本默认不打开COM、不发PUMP。"

