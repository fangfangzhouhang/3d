major_risks:
  - "Demo运动关卡只覆盖当前主发送器；center_object和calibrate_motor_mm_per_px脚本直接发串口运动，不能宣称所有运动入口都统一授权。"
  - "三人尚无稳定投入时间，采用核心/扩展/备用任务和实际专注时段回填。"
  - "用户持有相机和GPU经验，A阶段负担可能在标注/训练期上升，需要按两轮真实记录再平衡。"
  - "旧原型目录 legacy 已删除；不要把 YOLO、双目或 3D 空实现重新放回主入口。"
  - "模型训练可能被过早启动；必须先有HSV失败、人工标注和独立测试集。"
  - "HSV默认参数只针对高饱和红色标记物；真实相机、材料和光照变化可能使其立即失效。"
  - "Demo路线只考虑mask几何，不包含喷头直径、速度、平台动力学和真实障碍物。"

blockers:
  - "已有USB probe图片和本机camera Demo，但U500身份、条件、驱动信息和重复采集证据包未完成正式验收。"
  - "同条件可追溯U500批次数据集仍缺；旧13图已labeled且冻结开发/留出，来源unknown，不能写成U500过关集。"
  - "真实标记物、样本状态和固定成像条件尚未形成证据。"
  - "Stage 1 与 Stage 2 源码都在仓，但不能同时烧在一块 F103 上。FakeSerial 或测试通过不能写成联调完成。"
  - "步进方向和双轴试验已有提交，步距、限位开关、像素到毫米仍未验收。电机转了不是清洗。"

next_actions:
