major_risks:
  - "三人尚无稳定投入时间，采用核心/扩展/备用任务和实际专注时段回填。"
  - "用户持有相机和GPU经验，A阶段负担可能在标注/训练期上升，需要按两轮真实记录再平衡。"
  - "旧legacy代码和旧文档容易被误当当前入口；当前主线禁止导入legacy。"
  - "模型训练可能被过早启动；必须先有HSV失败、人工标注和独立测试集。"
  - "HSV默认参数只针对高饱和红色标记物；真实相机、材料和光照变化可能使其立即失效。"
  - "Demo路线只考虑mask几何，不包含喷头直径、速度、平台动力学和真实障碍物。"

blockers:
  - "U500尚未在本机执行probe和capture-test；适配器通过FakeVideoCapture测试不能写成实机接入完成。"
  - "A尚未提供结构化USB显微镜原图和采集批次；现有13份Labelme JSON已自动转换为13张Mask，但仍需逐份人工复核，其中只有1份在metadata中标记为labeled并完成算法对照。"
  - "真实标记物、样本状态和固定成像条件尚未形成证据。"
  - "STM32协议、标定和硬件安全事实缺失。"

